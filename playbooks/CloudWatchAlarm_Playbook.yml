---
- name: Create ALL Windows CloudWatch alarms
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - amazon.aws

  vars_files:
    - instances_details.yml

  vars:
    cpu_thresholds: [85, 95]

    memory_thresholds: [85, 95]

    disk_display_thresholds: [85, 95]
    disk_free_space_map:
      85: 15
      95: 5

    disk_letter: "C:"

    sns_actions: ["{{ sns_topic_arn }}"]

  tasks:

    ####################################################################
    # Validation
    ####################################################################
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - region is defined
          - sns_topic_arn is defined
          - instances is defined
          - instances | length > 0
        fail_msg: "Missing required variables"

    ####################################################################
    # CPU alarms
    ####################################################################
    - name: Build CPU alarm list
      ansible.builtin.set_fact:
        cpu_alarms: >-
          {{
            cpu_alarms | default([]) +
            [ {
                'instance': item[0].instance,
                'name': item[0].name,
                'threshold': item[1]
              } ]
          }}
      loop: "{{ instances | product(cpu_thresholds) | list }}"
      no_log: true
      changed_when: false

    - name: Create CPU alarms
      amazon.aws.cloudwatch_metric_alarm:
        state: present
        region: "{{ region }}"
        name: "{{ alarm.name }}-CPUUtilization-{{ alarm.threshold }}%-#Alarm"
        metric_name: CPUUtilization
        namespace: AWS/EC2
        statistic: Average
        comparison: GreaterThanOrEqualToThreshold
        threshold: "{{ alarm.threshold }}"
        period: 300
        evaluation_periods: 1
        dimensions:
          InstanceId: "{{ alarm.instance }}"
        alarm_actions: "{{ sns_actions }}"
        unit: Percent
      loop: "{{ cpu_alarms }}"
      loop_control:
        loop_var: alarm

    ####################################################################
    # Status checks
    ####################################################################
    - name: Create StatusCheckFailed_Instance alarms
      amazon.aws.cloudwatch_metric_alarm:
        state: present
        region: "{{ region }}"
        name: "{{ item.name }}-StatusCheck_Instance-#Alarm"
        metric_name: StatusCheckFailed_Instance
        namespace: AWS/EC2
        statistic: Maximum
        comparison: GreaterThanOrEqualToThreshold
        threshold: 1
        period: 60
        evaluation_periods: 1
        dimensions:
          InstanceId: "{{ item.instance }}"
        alarm_actions:
          - "arn:aws:automate:{{ region }}:ec2:reboot"
          - "{{ sns_topic_arn }}"
        unit: Count
      loop: "{{ instances }}"

    - name: Create StatusCheckFailed_System alarms
      amazon.aws.cloudwatch_metric_alarm:
        state: present
        region: "{{ region }}"
        name: "{{ item.name }}-StatusCheck_System-#Alarm"
        metric_name: StatusCheckFailed_System
        namespace: AWS/EC2
        statistic: Maximum
        comparison: GreaterThanOrEqualToThreshold
        threshold: 1
        period: 60
        evaluation_periods: 1
        dimensions:
          InstanceId: "{{ item.instance }}"
        alarm_actions:
          - "{{ sns_topic_arn }}"
          - "arn:aws:automate:{{ region }}:ec2:recover"
        unit: Count
      loop: "{{ instances }}"

    - name: Create StatusCheckFailed_AttachedEBS alarms
      amazon.aws.cloudwatch_metric_alarm:
        state: present
        region: "{{ region }}"
        name: "{{ item.name }}-StatusCheck_AttachedEBS-#Alarm"
        metric_name: StatusCheckFailed_AttachedEBS
        namespace: AWS/EC2
        statistic: Maximum
        comparison: GreaterThanOrEqualToThreshold
        threshold: 1
        period: 60
        evaluation_periods: 1
        dimensions:
          InstanceId: "{{ item.instance }}"
        alarm_actions: "{{ sns_actions }}"
        unit: Count
      loop: "{{ instances }}"

    ####################################################################
    # Memory alarms (Windows CWAgent)
    ####################################################################
    - name: Build Memory alarm list
      ansible.builtin.set_fact:
        mem_alarms: >-
          {{
            mem_alarms | default([]) +
            [ {
                'instance': item[0].instance,
                'name': item[0].name,
                'imageid': item[0].imageid,
                'instance_type': item[0].instance_type,
                'threshold': item[1]
              } ]
          }}
      loop: "{{ instances | product(memory_thresholds) | list }}"
      no_log: true
      changed_when: false

    - name: Create Memory alarms
      vars:
        final_dims:
          InstanceId: "{{ alarm.instance }}"
          ImageId: "{{ alarm.imageid }}"
          InstanceType: "{{ alarm.instance_type }}"
          objectname: "Memory"
      amazon.aws.cloudwatch_metric_alarm:
        state: present
        region: "{{ region }}"
        name: "{{ alarm.name }}-MemoryUsed-{{ alarm.threshold }}%-#Alarm"
        metric_name: "Memory % Committed Bytes In Use"
        namespace: CWAgent
        statistic: Average
        comparison: GreaterThanOrEqualToThreshold
        threshold: "{{ alarm.threshold }}"
        period: 300
        evaluation_periods: 1
        dimensions: "{{ final_dims }}"
        alarm_actions: "{{ sns_actions }}"
      loop: "{{ mem_alarms }}"
      loop_control:
        loop_var: alarm

    ####################################################################
    # Disk alarms (Windows CWAgent)
    ####################################################################
    - name: Build Disk alarm list
      ansible.builtin.set_fact:
        disk_alarms: >-
          {{
            disk_alarms | default([]) +
            [ {
                'instance': item[0].instance,
                'name': item[0].name,
                'imageid': item[0].imageid,
                'instance_type': item[0].instance_type,
                'display_threshold': item[1],
                'free_threshold': disk_free_space_map[item[1]]
              } ]
          }}
      loop: "{{ instances | product(disk_display_thresholds) | list }}"
      no_log: true
      changed_when: false

    - name: Create Disk alarms
      vars:
        final_dims:
          InstanceId: "{{ alarm.instance }}"
          ImageId: "{{ alarm.imageid }}"
          InstanceType: "{{ alarm.instance_type }}"
          objectname: "LogicalDisk"
          instance: "{{ disk_letter }}"
      amazon.aws.cloudwatch_metric_alarm:
        state: present
        region: "{{ region }}"
        name: "{{ alarm.name }}-DiskUsed-{{ alarm.display_threshold }}%-#Alarm"
        metric_name: "LogicalDisk % Free Space"
        namespace: CWAgent
        statistic: Average
        comparison: LessThanOrEqualToThreshold
        threshold: "{{ alarm.free_threshold }}"
        period: 300
        evaluation_periods: 1
        dimensions: "{{ final_dims }}"
        alarm_actions: "{{ sns_actions }}"
      loop: "{{ disk_alarms }}"
      loop_control:
        loop_var: alarm