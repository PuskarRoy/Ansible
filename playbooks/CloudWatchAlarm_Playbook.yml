---
- name: Create CPU, Disk, Status checks and Memory CloudWatch alarms
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - amazon.aws

  vars_prompt:
    - name: sns_topic_arn
      prompt: "Enter SNS Topic ARN"
      private: false

  vars_files:
    - instances_details.yml

  vars:
    thresholds: [85, 95]
    sns_actions:
      - "{{ sns_topic_arn }}"
    disk_path: "/"

  tasks:

    - name: Get AWS region from instance metadata
      ansible.builtin.shell: |
        TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" \
          -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")

        curl -s -H "X-aws-ec2-metadata-token: $TOKEN" \
          http://169.254.169.254/latest/dynamic/instance-identity/document \
          | grep region | awk -F\" '{print $4}'
      register: region
      changed_when: false
      args:
        executable: /bin/bash

    - name: Set region variable
      ansible.builtin.set_fact:
        region: "{{ region.stdout }}"

    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - sns_topic_arn is defined
          - region is defined
          - instances is defined
          - instances | length > 0
        fail_msg: "Please provide correct details in alarm_config.yml"

    - name: Build alarm list (instances × thresholds)
      ansible.builtin.set_fact:
        alarms: >-
          {{
            alarms | default([]) + [
              {
                'instance': item[0].instance,
                'name': item[0].name,
                'threshold': item[1],
                'device': item[0].device | default(None),
                'fstype': item[0].fstype | default(None),
                'imageid': item[0].imageid | default(None)
              }
            ]
          }}
      loop: "{{ instances | product(thresholds) | map('flatten') | list }}"
      loop_control:
        label: "{{ item[0].name }}:{{ item[1] }}"

    - name: Create CPU Utilization alarms
      amazon.aws.cloudwatch_metric_alarm:
        state: present
        region: "{{ region }}"
        name: "{{ alarm.name }}-CPUUtilization-{{ alarm.threshold }}%-#Alarm"
        metric_name: CPUUtilization
        namespace: AWS/EC2
        statistic: Average
        comparison: GreaterThanOrEqualToThreshold
        threshold: "{{ alarm.threshold }}"
        period: 300
        evaluation_periods: 1
        dimensions:
          InstanceId: "{{ alarm.instance }}"
        alarm_actions: "{{ sns_actions }}"
        unit: Percent
      loop: "{{ alarms }}"
      loop_control:
        loop_var: alarm

    - name: Create Disk alarms
      vars:
        final_dims:
          InstanceId: "{{ alarm.instance }}"
          path: "{{ disk_path }}"
          device: "{{ alarm.device }}"
          fstype: "{{ alarm.fstype }}"
          ImageId: "{{ alarm.imageid }}"
      amazon.aws.cloudwatch_metric_alarm:
        state: present
        region: "{{ region }}"
        name: "{{ alarm.name }}-DiskUsed-{{ alarm.threshold }}%-#Alarm"
        metric_name: disk_used_percent
        namespace: CWAgent
        statistic: Average
        comparison: GreaterThanOrEqualToThreshold
        threshold: "{{ alarm.threshold }}"
        period: 300
        evaluation_periods: 1
        dimensions: "{{ final_dims }}"
        alarm_actions: "{{ sns_actions }}"
        unit: Percent
      loop: "{{ alarms }}"
      loop_control:
        loop_var: alarm

    - name: Create StatusCheckFailed_Instance alarms
      amazon.aws.cloudwatch_metric_alarm:
        state: present
        region: "{{ region }}"
        name: "{{ item.name }}-StatusCheck_Instance-#Alarm"
        metric_name: StatusCheckFailed_Instance
        namespace: AWS/EC2
        statistic: Maximum
        comparison: GreaterThanOrEqualToThreshold
        threshold: 1
        period: 60
        evaluation_periods: 1
        dimensions:
          InstanceId: "{{ item.instance }}"
        alarm_actions:
          - "arn:aws:automate:{{ region }}:ec2:reboot"
          - "{{ sns_topic_arn }}"
        unit: Count
      loop: "{{ instances }}"
      loop_control:
        loop_var: item
        label: "{{ item.name }}"

    - name: Create StatusCheckFailed_System alarms
      amazon.aws.cloudwatch_metric_alarm:
        state: present
        region: "{{ region }}"
        name: "{{ item.name }}-StatusCheck_System-#Alarm"
        metric_name: StatusCheckFailed_System
        namespace: AWS/EC2
        statistic: Maximum
        comparison: GreaterThanOrEqualToThreshold
        threshold: 1
        period: 60
        evaluation_periods: 1
        dimensions:
          InstanceId: "{{ item.instance }}"
        alarm_actions:
          - "{{ sns_topic_arn }}"
          - "arn:aws:automate:{{ region }}:ec2:recover"
        unit: Count
      loop: "{{ instances }}"
      loop_control:
        loop_var: item
        label: "{{ item.name }}"

    - name: Create StatusCheckFailed_AttachedEBS alarms
      amazon.aws.cloudwatch_metric_alarm:
        state: present
        region: "{{ region }}"
        name: "{{ item.name }}-StatusCheck_AttachedEBS-#Alarm"
        metric_name: StatusCheckFailed_AttachedEBS
        namespace: AWS/EC2
        statistic: Maximum
        comparison: GreaterThanOrEqualToThreshold
        threshold: 1
        period: 60
        evaluation_periods: 1
        dimensions:
          InstanceId: "{{ item.instance }}"
        alarm_actions: "{{ sns_actions }}"
        unit: Count
      loop: "{{ instances }}"
      loop_control:
        loop_var: item
        label: "{{ item.name }}"

    - name: Build memory alarm list
      ansible.builtin.set_fact:
        mem_alarms: >-
          {{
            mem_alarms | default([]) + [
              {
                'instance': item[0].instance,
                'name': item[0].name,
                'threshold': item[1],
                'imageid': item[0].imageid
              }
            ]
          }}
      loop: "{{ instances | product(thresholds) | map('flatten') | list }}"
      loop_control:
        label: "{{ item[0].name }} → {{ item[1] }}"

    - name: Create Memory alarms
      vars:
        final_dims:
          InstanceId: "{{ alarm.instance }}"
          ImageId: "{{ alarm.imageid }}"
      amazon.aws.cloudwatch_metric_alarm:
        state: present
        region: "{{ region }}"
        name: "{{ alarm.name }}-MemoryUsed-{{ alarm.threshold }}%-#Alarm"
        metric_name: mem_used_percent
        namespace: CWAgent
        statistic: Average
        comparison: GreaterThanOrEqualToThreshold
        threshold: "{{ alarm.threshold }}"
        period: 300
        evaluation_periods: 1
        dimensions: "{{ final_dims }}"
        alarm_actions: "{{ sns_actions }}"
        unit: Percent
      loop: "{{ mem_alarms | default([]) }}"
      loop_control:
        loop_var: alarm