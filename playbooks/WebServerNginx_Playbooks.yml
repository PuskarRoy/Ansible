- name: Install and configure NGINX
  hosts: all
  become: true
  gather_facts: true

  tasks:

  ####################################################################
  # UPDATE
  ####################################################################

  - name: Update apt packages
    ansible.builtin.apt:
      update_cache: yes
    when: ansible_os_family == "Debian"

  - name: Update dnf packages
    ansible.builtin.dnf:
      name: "*"
      state: latest
    when: ansible_os_family == "RedHat" or ansible_distribution == "Amazon"

  ####################################################################
  # INSTALL NGINX
  ####################################################################

  - name: Install NGINX (Debian)
    ansible.builtin.apt:
      name: nginx
      state: present
    when: ansible_os_family == "Debian"

  - name: Install NGINX (RHEL/Amazon)
    ansible.builtin.dnf:
      name: nginx
      state: present
    when: ansible_os_family == "RedHat" or ansible_distribution == "Amazon"

  ####################################################################
  # WEB ROOT
  ####################################################################

  - name: Create web root directory
    ansible.builtin.file:
      path: /var/www/html
      state: directory
      owner: "{{ 'www-data' if ansible_os_family == 'Debian' else 'nginx' }}"
      group: "{{ 'www-data' if ansible_os_family == 'Debian' else 'nginx' }}"
      mode: '0755'

  ####################################################################
  # NGINX CONFIG
  ####################################################################

  - name: Configure nginx (RHEL/Amazon)
    ansible.builtin.copy:
      dest: /etc/nginx/conf.d/default.conf
      content: |
        server {
            listen 80;
            server_name _;

            root /var/www/html;
            index index.html index.htm;

            location / {
                try_files $uri $uri/ =404;
            }
        }
    notify: Restart nginx
    when: ansible_os_family == "RedHat" or ansible_distribution == "Amazon"

  - name: Configure nginx (Debian)
    ansible.builtin.copy:
      dest: /etc/nginx/sites-available/default
      content: |
        server {
            listen 80;
            server_name _;

            root /var/www/html;
            index index.html index.htm;

            location / {
                try_files $uri $uri/ =404;
            }
        }
    notify: Restart nginx
    when: ansible_os_family == "Debian"

  ####################################################################
  # TEST PAGE
  ####################################################################

  - name: Create test page
    ansible.builtin.copy:
      dest: /var/www/html/index.html
      content: |
        <h1>NGINX is working - Ansible Managed</h1>
      mode: '0644'

  ####################################################################
  # SERVICE
  ####################################################################

  - name: Start and enable nginx
    ansible.builtin.service:
      name: nginx
      state: started
      enabled: true

  ####################################################################
  # HANDLER
  ####################################################################

  handlers:
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted