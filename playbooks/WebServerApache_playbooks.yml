- name: Install and configure Apache Web Server
  hosts: all
  become: true
  gather_facts: true

  tasks:

    ####################################################################
    # OS UPDATE
    ####################################################################

    - name: Update packages (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: Update packages (Amazon Linux / RHEL)
      ansible.builtin.dnf:
        name: "*"
        state: latest
      when: ansible_facts['os_family'] == "RedHat" or ansible_facts['distribution'] == "Amazon"

    ####################################################################
    # APACHE INSTALL
    ####################################################################

    - name: Install Apache (Debian/Ubuntu)
      ansible.builtin.apt:
        name: apache2
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Install Apache (Amazon Linux / RHEL)
      ansible.builtin.dnf:
        name: httpd
        state: present
      when: ansible_facts['os_family'] == "RedHat" or ansible_facts['distribution'] == "Amazon"

    ####################################################################
    # SERVICE MANAGEMENT
    ####################################################################

    - name: Start and enable Apache (Debian/Ubuntu)
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true
      when: ansible_facts['os_family'] == "Debian"

    - name: Start and enable Apache (Amazon Linux / RHEL)
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true
      when: ansible_facts['os_family'] == "RedHat" or ansible_facts['distribution'] == "Amazon"


    ####################################################################
    # OPTIONAL: TEST PAGE
    ####################################################################

    - name: Deploy test index.html
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          <html>
          <h1>Apache is working - Ansible Managed</h1>
          </html>