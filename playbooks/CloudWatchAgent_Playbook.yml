---
- name: Run PowerShell script to Install Cloud_Watch_Agent
  hosts: all
  gather_facts: false

  tasks:
    - name: Download CloudWatch Agent MSI
      ansible.windows.win_get_url:
        url: https://amazoncloudwatch-agent.s3.amazonaws.com/windows/amd64/latest/amazon-cloudwatch-agent.msi
        dest: C:\Users\Administrator\Downloads\amazon-cloudwatch-agent.msi
    
    - name: Download AWS CLI MSI
      ansible.windows.win_get_url:
        url: https://awscli.amazonaws.com/AWSCLIV2.msi
        dest: C:\Users\Administrator\Downloads\aws_cli.msi


    - name: Run the PowerShell script for CloudWatchAgent and Aws CLi
      ansible.windows.win_shell: |
        Start-Process `
          -FilePath "msiexec.exe" `
          -ArgumentList '/i "C:\Users\Administrator\Downloads\amazon-cloudwatch-agent.msi" /qn /norestart' `
          -Wait

        Start-Process `
          -FilePath "msiexec.exe" `
          -ArgumentList '/i "C:\Users\Administrator\Downloads\aws_cli.msi" /qn /norestart' `
          -Wait


        $config = @'
        {
          "metrics": {
            "append_dimensions": {
              "AutoScalingGroupName": "${aws:AutoScalingGroupName}",
              "ImageId": "${aws:ImageId}",
              "InstanceId": "${aws:InstanceId}",
              "InstanceType": "${aws:InstanceType}"
            },
            "metrics_collected": {
              "LogicalDisk": {
                "measurement": [
                  "% Free Space"
                ],
                "metrics_collection_interval": 60,
                "resources": [
                  "C:"
                ]
              },
              "Memory": {
                "measurement": [
                  "% Committed Bytes In Use"
                ],
                "metrics_collection_interval": 60
              }
            }
          }
        }
        '@


        Set-Content "C:\Program Files\Amazon\AmazonCloudWatchAgent\config.json" $config

        & "C:\Program Files\Amazon\AmazonCloudWatchAgent\amazon-cloudwatch-agent-ctl.ps1" -a fetch-config -m ec2 -s -c file:"C:\Program Files\Amazon\AmazonCloudWatchAgent\config.json"

    - name: Run the Powershell script for Generating instance details
      ansible.windows.win_shell: |
        # Fail immediately on any error
        $ErrorActionPreference = "Stop"

        # -------- IMDSv2 Token --------
        $token = Invoke-RestMethod -Method PUT `
          -Uri "http://169.254.169.254/latest/api/token" `
          -Headers @{ "X-aws-ec2-metadata-token-ttl-seconds" = "21600" }

        $headers = @{ "X-aws-ec2-metadata-token" = $token }

        # -------- Metadata --------
        $INSTANCE_ID = Invoke-RestMethod `
          -Uri "http://169.254.169.254/latest/meta-data/instance-id" `
          -Headers $headers

        $IMAGE_ID = Invoke-RestMethod `
          -Uri "http://169.254.169.254/latest/meta-data/ami-id" `
          -Headers $headers

        $INSTANCE_TYPE = Invoke-RestMethod `
          -Uri "http://169.254.169.254/latest/meta-data/instance-type" `
          -Headers $headers

        # -------- Region (important for AWS CLI) --------
        $REGION = Invoke-RestMethod `
          -Uri "http://169.254.169.254/latest/meta-data/placement/region" `
          -Headers $headers

        $AWS = "C:\Program Files\Amazon\AWSCLIV2\aws.exe"

        # Optional safety check
        if (!(Test-Path $AWS)) {
            throw "AWS CLI not found at $AWS"
        }

        # -------- Get Instance Name --------
        $INSTANCE_NAME = & $AWS ec2 describe-tags `
          --region $REGION `
          --filters "Name=resource-id,Values=$INSTANCE_ID" "Name=key,Values=Name" `
          --query "Tags[0].Value" `
          --output text

        # -------- Output file --------
        $FilePath = "C:\Users\Administrator\Downloads\data_$INSTANCE_ID.txt"

        # -------- File content --------
        $Content = @"
        name: $INSTANCE_NAME
        instance_id: $INSTANCE_ID
        imageid: $IMAGE_ID
        instance-type: $INSTANCE_TYPE
        "@

        # -------- Write UTF-8 WITHOUT BOM --------
        [System.IO.File]::WriteAllText(
            $FilePath,
            $Content,
            (New-Object System.Text.UTF8Encoding($false))
        )

        Write-Output "Metadata file created: $FilePath" 

    - name: Collect instance data files and clean up remote
      block:
        - ansible.builtin.file:
            path: ./instance_data
            state: directory
            mode: '0755'
          delegate_to: localhost
          run_once: true
    
        - ansible.windows.win_find:
            paths: 'C:/Users/Administrator/Downloads'
            patterns: 
              - 'data_*.txt'
          register: data_files

        - ansible.builtin.fetch:
            src: "{{ item.path }}"
            dest: ./instance_data/
            flat: yes
          loop: "{{ data_files.files }}"
          when: data_files.matched > 0

        - ansible.windows.win_file:
            path: "{{ item.path }}"
            state: absent
          loop: "{{ data_files.files }}"
          when: data_files.matched > 0

    - name: Clean-Up from local server
      ansible.builtin.shell: |
        cd ./instance_data || exit 1

        OUTPUT="../instances_details.yml"

        # Start fresh YAML
        echo "instances:" > "$OUTPUT"

        for f in data_*; do
            [ -f "$f" ] || continue

            NAME=$(grep '^name:' "$f" | cut -d':' -f2- | xargs || true)
            INSTANCE_ID=$(grep '^instance_id:' "$f" | cut -d':' -f2- | xargs || true)
            IMAGEID=$(grep '^imageid:' "$f" | cut -d':' -f2- | xargs || true)
            INSTANCE_TYPE=$(grep '^instance-type:' "$f" | cut -d':' -f2- | xargs || true)

            # Skip if critical data missing
            if [[ -z "$INSTANCE_ID" ]]; then
                echo "Skipping file $f (missing instance_id)"
                continue
            fi

            # Write YAML safely (quoted to avoid YAML parsing issues)
            cat <<EOF >> "$OUTPUT"
          - name: "${NAME}"
            instance: "${INSTANCE_ID}"
            imageid: "${IMAGEID}"
            instance_type: "${INSTANCE_TYPE}"

        EOF

        done

        cd ..
        rm -rf ./instance_data

        echo "YAML file created at: $OUTPUT"
      delegate_to: localhost
      run_once: true   