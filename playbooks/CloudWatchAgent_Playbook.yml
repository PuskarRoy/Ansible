---
- name: Configure Linux Servers
  hosts: all
  become: true
  gather_facts: true

  tasks:

    #################################################################
    # Update Packages
    #################################################################

    - name: Update apt cache on Debian/Ubuntu
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: Install required packages on Debian/Ubuntu
      ansible.builtin.apt:
        name:
          - wget
          - unzip
          - curl
        state: present
      when: ansible_facts['os_family'] == "Debian"

    - name: Install required packages on RedHat/Amazon Linux
      ansible.builtin.yum:
        name:
          - wget
          - unzip
          - curl
        state: present
      when: ansible_facts['os_family'] == "RedHat"

    #################################################################
    # Install AWS CLI
    #################################################################

    - name: Install AWS CLI v2
      ansible.builtin.shell: |
        set -e

        cd /tmp

        rm -rf aws awscliv2.zip

        curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"

        unzip -oq awscliv2.zip

        ./aws/install --update

        rm -rf aws awscliv2.zip
      args:
        executable: /bin/bash

    #################################################################
    # Install CloudWatch Agent
    #################################################################

    - name: Install and Configure CloudWatch Agent
      ansible.builtin.shell: |
        set -e

        TEMP_DIR="/tmp/cloudwatch-agent-temp"
        CONFIG_FILE="/opt/aws/amazon-cloudwatch-agent/bin/config.json"

        rm -rf "$TEMP_DIR"

        mkdir -p "$TEMP_DIR"

        cd "$TEMP_DIR"

        wget -q -O AmazonCloudWatchAgent.zip \
        https://s3.amazonaws.com/amazoncloudwatch-agent/linux/amd64/latest/AmazonCloudWatchAgent.zip

        unzip -oq AmazonCloudWatchAgent.zip

        ./install.sh

        mkdir -p "$(dirname "$CONFIG_FILE")"

        cat > "$CONFIG_FILE" <<'EOT'
        {
            "agent": {
                "metrics_collection_interval": 60,
                "run_as_user": "cwagent"
            },
            "metrics": {
                "append_dimensions": {
                    "AutoScalingGroupName": "${aws:AutoScalingGroupName}",
                    "ImageId": "${aws:ImageId}",
                    "InstanceId": "${aws:InstanceId}"
                },
                "metrics_collected": {
                    "disk": {
                        "measurement": [
                            "used_percent"
                        ],
                        "metrics_collection_interval": 60,
                        "resources": [
                            "/"
                        ]
                    },
                    "mem": {
                        "measurement": [
                            "mem_used_percent"
                        ],
                        "metrics_collection_interval": 60
                    }
                }
            }
        }
        EOT

        /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
          -a fetch-config \
          -m ec2 \
          -c file:$CONFIG_FILE \
          -s

        systemctl enable amazon-cloudwatch-agent

        systemctl restart amazon-cloudwatch-agent

        rm -rf "$TEMP_DIR"
      args:
        executable: /bin/bash

    #################################################################
    # Verify CloudWatch Agent
    #################################################################

    - name: Check CloudWatch Agent status
      ansible.builtin.shell: |
        systemctl status amazon-cloudwatch-agent --no-pager
      register: cw_status
      ignore_errors: true

    - name: Show CloudWatch Agent status
      ansible.builtin.debug:
        var: cw_status.stdout_lines

    #################################################################
    # Gather EC2 Instance Details
    #################################################################

    - name: Gather instance details
      ansible.builtin.shell: |
        set -e

        TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" \
          -H "X-aws-ec2-metadata-token-ttl-seconds: 21600")

        INSTANCE_ID=$(curl -s \
          -H "X-aws-ec2-metadata-token: $TOKEN" \
          http://169.254.169.254/latest/meta-data/instance-id)

        ROOT_DEVICE=$(lsblk -fro NAME,FSTYPE,MOUNTPOINT | grep " /$" | awk '{print $1}')

        FSTYPE=$(lsblk -fro NAME,FSTYPE,MOUNTPOINT | grep " /$" | awk '{print $2}')

        IMAGE_ID=$(aws ec2 describe-instances \
          --instance-ids "$INSTANCE_ID" \
          --query 'Reservations[].Instances[].ImageId' \
          --output text)

        INSTANCE_NAME=$(aws ec2 describe-instances \
          --instance-ids "$INSTANCE_ID" \
          --query "Reservations[].Instances[].Tags[?Key=='Name'].Value | [0]" \
          --output text)

        OUTPUT_FILE="$HOME/data_${INSTANCE_ID}.txt"

        {
          echo "name: $INSTANCE_NAME"
          echo "instance: $INSTANCE_ID"
          echo "device: $ROOT_DEVICE"
          echo "fstype: $FSTYPE"
          echo "imageid: $IMAGE_ID"
        } > "$OUTPUT_FILE"
      args:
        executable: /bin/bash

    #################################################################
    # Find Generated Files
    #################################################################

    - name: Find instance data files
      ansible.builtin.find:
        paths: "{{ ansible_user_dir }}"
        patterns: '^data_.*\.txt$'
        use_regex: yes
        file_type: file
      register: found_files

    #################################################################
    # Create Local Folder
    #################################################################

    - name: Create local temp folder
      delegate_to: localhost
      run_once: true
      become: false
      ansible.builtin.file:
        path: "./instance_data"
        state: directory

    #################################################################
    # Fetch Files
    #################################################################

    - name: Fetch instance data files
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "./instance_data/"
        flat: yes
      loop: "{{ found_files.files }}"
      when: found_files.matched | default(0) > 0

    #################################################################
    # Delete Remote Files
    #################################################################

    - name: Delete remote temp files
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ found_files.files }}"
      when: found_files.matched | default(0) > 0

    #################################################################
    # Aggregate Data
    #################################################################

    - name: Aggregate instance details
      delegate_to: localhost
      run_once: true
      ansible.builtin.shell: |
        set -e

        OUTPUT="instances_details.yml"

        echo "instances:" > "$OUTPUT"

        cd ./instance_data

        for f in data_*; do

          [ -f "$f" ] || continue

          NAME=$(grep '^name:' "$f" | cut -d':' -f2- | xargs)
          INSTANCE=$(grep '^instance:' "$f" | cut -d':' -f2- | xargs)
          DEVICE=$(grep '^device:' "$f" | cut -d':' -f2- | xargs)
          FSTYPE=$(grep '^fstype:' "$f" | cut -d':' -f2- | xargs)
          IMAGEID=$(grep '^imageid:' "$f" | cut -d':' -f2- | xargs)

          echo "  - name: $NAME" >> ../$OUTPUT
          echo "    instance: $INSTANCE" >> ../$OUTPUT
          echo "    device: $DEVICE" >> ../$OUTPUT
          echo "    fstype: $FSTYPE" >> ../$OUTPUT
          echo "    imageid: $IMAGEID" >> ../$OUTPUT
          echo "" >> ../$OUTPUT

        done
      args:
        executable: /bin/bash

    #################################################################
    # Cleanup Local Folder
    #################################################################

    - name: Remove local temp folder
      delegate_to: localhost
      run_once: true
      ansible.builtin.file:
        path: "./instance_data"
        state: absent
